name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11.16"
          - os: ubuntu-latest
            python-version: "3.12.14"
          - os: ubuntu-latest
            python-version: "3.13.15"
          - os: ubuntu-latest
            python-version: "3.14.7"
          - os: windows-2022
            python-version: "3.11.16"
          - os: windows-latest
            python-version: "3.14.7"
          - os: macos-latest
            python-version: "3.14.7"
    steps:
      - name: Check out without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify locked package build and isolated install
        run: python scripts/verify_package_build.py

      - name: Run synthetic tests
        run: python -m unittest discover -s tests -v

      - name: Verify public allowlist and metadata
        run: python scripts/verify_release.py

      - name: Build deterministic source archive
        run: python scripts/build_source_archive.py --check-reproducible

      - name: Verify exact source archive
        run: python scripts/verify_release.py --archive dist/source-read-0.2.0.zip
